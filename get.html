<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get MyServiceTime</title>
  <meta name="description" content="MyServiceTime on your phone, iPad and computer. Scan the QR code to open it or share it." />
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="manifest" href="manifest.json" />
  <script src="theme.js?v=311"></script>
  <link rel="stylesheet" href="get.css?v=311" />
</head>
<body>
  <!-- "Get the app": phone + iPad pictures of MyServiceTime, and a QR code to open it or share it (get.js). -->
  <header class="g-top">
    <a href="./get.html" class="g-brand"><img src="icons/logo.svg?v=311" alt="" width="30" height="30" /> MyServiceTime</a>
    <div class="g-top-right">
      <label class="g-lang">🌐 <select id="gLang" aria-label="Language"></select></label>
      <a class="g-btn g-btn-light" href="./#app" data-open-app data-i18n="getOpen"></a>
    </div>
  </header>

  <main>
    <section class="g-hero">
      <div class="g-hero-text">
        <span class="g-kicker"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 18.5h3"/></svg><span data-i18n="getNav"></span></span>
        <h1 data-i18n="getTitle"></h1>
        <p class="g-sub" data-i18n="getSub"></p>
        <div class="g-btns">
          <a class="g-btn" href="./#app" data-open-app data-i18n="getOpen"></a>
          <button type="button" class="g-btn g-btn-ghost" id="gDownload" data-i18n="getDownload"></button>
          <button type="button" class="g-btn g-btn-ghost" id="gShare" data-i18n="shareBtn"></button>
        </div>
        <p class="g-msg g-dl-msg" id="gDlMsg" role="status"></p>
      </div>

      <!-- an iPad with a phone in front of it, both showing MyServiceTime -->
      <div class="g-devices">
        <div class="g-ipad" aria-hidden="true"><img src="site/ipad-home.jpg?v=311" alt="" loading="eager" /></div>
        <div class="g-phone" aria-hidden="true"><img src="site/phone-home.jpg?v=311" alt="" loading="eager" /></div>
        <!-- a watch: MyServiceTime's time tracker on the wrist (coming soon) -->
        <div class="g-watch">
          <div class="g-band g-band-top" aria-hidden="true"></div>
          <div class="g-case" aria-hidden="true">
            <div class="g-face">
              <img src="icons/logo.svg?v=311" alt="" />
              <span class="g-w-label" data-i18n="getWatchLabel"></span>
              <b class="g-w-time">1:24:09</b>
              <span class="g-w-btns"><i>⏸</i><i>■</i></span>
            </div>
          </div>
          <div class="g-band g-band-bottom" aria-hidden="true"></div>
          <span class="g-soon" data-i18n="getWatchSoon"></span>
        </div>
      </div>
    </section>

    <!-- what they'll find inside: real pictures of the app -->
    <section class="g-section">
      <h2 class="g-h2" data-i18n="getFindTitle"></h2>
      <div class="g-feats">
        <article class="g-feat">
          <div class="g-mini"><img src="site/f-progress.jpg?v=311" alt="" loading="lazy" /></div>
          <h3 data-i18n="getF1T"></h3>
          <p data-i18n="getF1D"></p>
        </article>
        <article class="g-feat">
          <div class="g-mini"><img src="site/f-events.jpg?v=311" alt="" loading="lazy" /></div>
          <h3 data-i18n="getF2T"></h3>
          <p data-i18n="getF2D"></p>
        </article>
        <article class="g-feat">
          <div class="g-mini"><img src="site/f-assign.jpg?v=311" alt="" loading="lazy" /></div>
          <h3 data-i18n="getF3T"></h3>
          <p data-i18n="getF3D"></p>
        </article>
        <article class="g-feat">
          <div class="g-mini"><img src="site/f-territories.jpg?v=311" alt="" loading="lazy" /></div>
          <h3 data-i18n="getF4T"></h3>
          <p data-i18n="getF4D"></p>
        </article>
      </div>
      <p class="g-more" data-i18n="getMore"></p>
    </section>

    <!-- why they'll be happy with it -->
    <section class="g-card">
      <h2 class="g-h2 g-h2-in" data-i18n="getWhyTitle"></h2>
      <div class="g-why">
        <div class="g-why-item"><span class="g-step-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <div><h3 data-i18n="getW1T"></h3><p data-i18n="getW1D"></p></div></div>
        <div class="g-why-item"><span class="g-step-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span>
          <div><h3 data-i18n="getW2T"></h3><p data-i18n="getW2D"></p></div></div>
        <div class="g-why-item"><span class="g-step-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span>
          <div><h3 data-i18n="getW3T"></h3><p data-i18n="getW3D"></p></div></div>
        <div class="g-why-item"><span class="g-step-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9-9.2C1.7 8.4 3.8 5 7.2 5c2 0 3.6 1.1 4.8 2.8C13.2 6.1 14.8 5 16.8 5c3.4 0 5.5 3.4 4.2 6.8C19 16.6 12 21 12 21z"/></svg></span>
          <div><h3 data-i18n="getW4T"></h3><p data-i18n="getW4D"></p></div></div>
      </div>
    </section>

    <section class="g-card g-qr-card" id="gQrCard">
      <div class="g-qr" id="gQr"></div>
      <div class="g-qr-text">
        <h2 data-i18n="getScanTitle"></h2>
        <p data-i18n="shareScan"></p>
        <p class="g-link" id="gLink"></p>
        <div class="g-btns">
          <button type="button" class="g-btn" id="gShare2" data-i18n="shareBtn"></button>
          <button type="button" class="g-btn g-btn-ghost" id="gCopy" data-i18n="shareCopy"></button>
        </div>
        <p class="g-msg" id="gMsg" role="status"></p>
      </div>
    </section>

    <section class="g-card" id="gInstall">
      <h2 data-i18n="getInstallTitle"></h2>
      <!-- the store apps (the links come from config.js once they are published; until then "Coming soon") -->
      <div class="g-stores">
        <a class="g-store" id="gPlay" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18.5h.01"/></svg>
          <span><b>Google Play</b><small data-i18n="getStoreSoon"></small></span></a>
        <a class="g-store" id="gApple" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 18.5h3"/></svg>
          <span><b>App Store</b><small data-i18n="getStoreSoon"></small></span></a>
      </div>
      <div class="g-steps">
        <div class="g-step"><span class="g-step-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10.5 18.5h3"/></svg></span>
          <div><strong>iPhone · iPad</strong><p data-i18n="getIos"></p></div></div>
        <div class="g-step"><span class="g-step-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 18.5h.01"/></svg></span>
          <div><strong>Android</strong><p data-i18n="getAndroid"></p></div></div>
        <div class="g-step"><span class="g-step-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
          <div><strong data-i18n="getComputer"></strong><p data-i18n="getComputerHow"></p></div></div>
      </div>
    </section>
  </main>

  <footer class="g-foot">
    <p class="g-help" data-support-wrap hidden><span data-i18n="helpMailTitle"></span> <span data-i18n="helpMailText"></span> <a data-support data-support-addr></a></p>
    <a href="privacy.html" data-i18n="legalPrivacy"></a> · <a href="terms.html" data-i18n="legalTerms"></a>
    <p data-copyright></p>
  </footer>

  <script src="config.js?v=311"></script>
  <script src="i18n-core.js?v=311"></script>
  <script>document.write('<script src="lang/' + lang + '.js?v=311"><\/script>');</script>
  <script src="vendor/qrcode.js?v=311"></script>
  <script src="get.js?v=311"></script>
</body>
</html>
